site_name: Yarpad Help Center
site_url: https://help.yarpad.app/
site_description: Official help and guidance for Yarpad teachers and students.
docs_dir: docs
use_directory_urls: true

exclude_docs: |
  /investigate/

hooks:
  - scripts/mkdocs_hooks.py

nav:
  - Home: index.md
  - Getting Started with Yarpad: getting-started/getting-started.md
  - Teacher Guide:
      - Create and Activate Your Teacher Account: teachers/getting-started/create-account.md
      - Create and Manage Your Teacher Profile: teachers/getting-started/teacher-profile.md
      - Configure Teacher Working Hours: teachers/getting-started/working-hours.md
      - Manage Teacher Unavailable Times: teachers/getting-started/unavailable-times.md
  - Legal:
      - Terms of Service: legal/terms-of-service.md
      - Privacy Policy: legal/privacy-policy.md

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/yarpad-logo.svg
  favicon: assets/images/yarpad-logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

# The built-in search plugin is the only content plugin. MkDocs also generates
# sitemap.xml automatically because site_url is configured above.
plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  google_site_verification: null
